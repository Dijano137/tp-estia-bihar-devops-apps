# DOC: https://docs.github.com/en/actions/publishing-packages/publishing-docker-images
name: Build the app docker image

on:
  push

jobs:
  versioning:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.versioning.outputs.version }}
      imageName: ${{ steps.versioning.outputs.imageName }}

    steps:
      - uses: actions/checkout@v4
      - name: Compute versions
        id: versioning
        run: |
          version=$(git rev-parse --short HEAD)
          imageName=$(echo "ghcr.io/${{github.repository}}:$version" | tr '[:upper:]' '[:lower:]')
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "imageName=$imageName" >> $GITHUB_OUTPUT
          echo "the image name :'$imageName'"
          echo "## 🔖 New version '$version'" >> $GITHUB_STEP_SUMMARY
          echo "## 📦 Image '$imageName'" >> $GITHUB_STEP_SUMMARY

  unit-tests:
    runs-on: ubuntu-latest
    
    steps:
       - uses: actions/checkout@v4
       - uses: actions/setup-go@v5 
         with: 
          go-version-file: go.mod

       - name: Unit tests
         run: go test -v .

  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    needs: [versioning, unit-tests]

    steps:
      - uses: actions/checkout@v4
        
      - run: echo "${{secrets.GITHUB_TOKEN}}" | docker login ghcr.io -u "${{github.actor}}" --password-stdin

      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true           
          tags: ${{ needs.versioning.outputs.imageName }}
   
  
  api-tests:
    runs-on: ubuntu-latest
    needs: [build-and-push, versioning]

    # Our API server, running in the background
    services:
      backend:
        image: ${{needs.versioning.outputs.imageName}}
        credentials:
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}
        ports:
        - 8080:8081

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: API tests
        run: |
          echo "## 🌐 API tests using ${{needs.versioning.outputs.imageName}}" >> $GITHUB_STEP_SUMMARY
          go test -count=1 -v ./test/apitests

  deploy-dev:
    runs-on: ubuntu-latest
    needs: [versioning, api-tests]          # seulement si TOUS les tests sont OK
    if: github.ref == 'refs/heads/master'   # seulement pour les push sur master
    permissions:
      contents: write                       # droit d'ÉCRIRE dans le dépôt (pour pousser)

    steps:
      # 1. Récupérer la branche de déploiement (et non le code)
      - uses: actions/checkout@v4
        with:
          ref: deploy-dev

      # 2. Écrire la nouvelle version, commiter et pousser
      - name: Update version.txt on deploy-dev
        run: |
          echo "${{ needs.versioning.outputs.version }}" > version.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.txt
          git commit -m "Deploy ${{ needs.versioning.outputs.version }} to dev"
          git push
          echo "## 🚀 Deployed '${{ needs.versioning.outputs.version }}' to dev" >> $GITHUB_STEP_SUMMARY